<!doctype html>
<html lang="{{ site.lang | default: 'zh-CN' }}">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="{{ page.description | default: site.description | escape }}">
    <meta name="theme-color" content="#f5f3ee">
    <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
    <link rel="alternate" type="application/atom+xml" title="{{ site.title }}" href="{{ '/feed.xml' | relative_url }}">
    <title>{% if page.title %}{{ page.title }} | {% endif %}{{ site.title }}</title>
  </head>
  <body>
    <header class="site-header">
      <div class="wrap header-content">
        <a class="brand" href="{{ '/' | relative_url }}">云客 <span>/ YUNKEWEB</span></a>
        <nav aria-label="主导航">
          <a href="{{ '/' | relative_url }}">文章</a>
          <a href="{{ '/about/' | relative_url }}">关于</a>
          <a href="mailto:hello@yunkeweb.com">联系</a>
        </nav>
      </div>
    </header>

    <main class="wrap">
      {{ content }}
    </main>

    <footer class="site-footer">
      <div class="wrap">© {{ 'now' | date: '%Y' }} 云客 · 保持好奇</div>
    </footer>
  </body>
</html>
